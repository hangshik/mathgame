<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>줄고누</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --active: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --text: #222222;
      --sub: #555555;
      --border: #e9ecef;
      --board-bg: #fffdf9;
    }
    * { box-sizing: border-box; touch-action: manipulation; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 15px 10px; user-select: none; -webkit-user-select: none; }
    h1 { font-size: 36px; font-weight: 800; text-align: center; margin: 20px 0 30px; color: var(--text); }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
    .container-fixed { background-color: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; }
    .game-area { display: flex; flex-direction: column; align-items: center; }
    .game-toolbar { width: 100%; margin-bottom: 15px; text-align: center; }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--sub); transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input#color-toggle:checked + .slider { background-color: var(--danger); }
    input#color-toggle:not(:checked) + .slider { background-color: var(--active); }
    input#turn-toggle:checked + .slider { background-color: var(--text); }
    input#turn-toggle:not(:checked) + .slider { background-color: var(--sub); }
    input:checked + .slider:before { transform: translateX(20px); }
    .status-badge { padding: 8px 20px; border-radius: 25px; font-weight: 800; font-size: 18px; text-align: center; width: 100%; max-width: 350px; margin: 10px auto 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.3s ease; }
    .red-turn { background-color: #fdf2f2; color: var(--danger); border: 2px solid var(--danger); }
    .blue-turn { background-color: #f0f7ff; color: var(--active); border: 2px solid var(--active); }
    .board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1 / 1; background-color: var(--board-bg); border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.03); border: 5px solid var(--border); touch-action: none; overflow: hidden; transition: max-width 0.3s ease, border-color 0.3s ease; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .piece-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
    .grid-cell { display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .grid-piece { width: 80%; height: 80%; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); box-sizing: border-box; transition: transform 0.2s; }
    .grid-piece.red { background-color: var(--danger); border-color: #b02a37; box-shadow: 0 2px 0 #b02a37; }
    .grid-piece.blue { background-color: var(--active); border-color: #0a58ca; box-shadow: 0 2px 0 #0a58ca; }
    .grid-piece.selected { transform: scale(1.15); outline: 3px solid #ffd700; z-index: 5; }
    .grid-hint { width: 35%; height: 35%; background: rgba(40, 167, 69, 0.6); border-radius: 50%; }
    .control-btn { height: 46px; padding: 0 18px; font-size: 15px; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; color: #ffffff; transition: opacity 0.2s; background-color: var(--sub); }
    .control-btn:active { opacity: 0.8; }
    .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .guide-box { background-color: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); padding: 20px; margin-bottom: 15px; word-break: keep-all; font-size: 15px; line-height: 1.6; color: var(--sub); }
    .guide-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .guide-box h2 { margin-bottom: 0; }
    .box-stats { border-left: 6px solid var(--danger); }
    .box-stats h2 { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
    th, td { border: 1px solid var(--border); padding: 10px; }
    th { background-color: #f8f9fa; font-weight: 700; color: var(--text); }
    .btn-reset-stats { background-color: #ffffff; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .box-rules { border-left: 6px solid var(--active); }
    .box-rules h2 { color: var(--active); }
    .box-rules ul { list-style-type: none; }
    .box-rules li::before { content: "• "; font-weight: bold; }
    .box-keys { border-left: 6px solid var(--success); }
    .box-keys h2 { color: var(--success); }
    .key-badge { display: inline-block; background-color: #f0f2f5; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; font-size: 14px; font-weight: 700; color: var(--text); box-shadow: 0 2px 0 #ccc; margin: 0 4px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: visibility 0.2s, opacity 0.2s; }
    .modal-overlay.show { visibility: visible; opacity: 1; }
    .modal-card { background-color: var(--card-bg); width: 90%; max-width: 350px; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.2); transform: translateY(-20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .modal-overlay.show .modal-card { transform: translateY(0); }
    .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; word-break: keep-all; }
    .modal-success .modal-card { border-top: 6px solid var(--success); }
    .modal-success .modal-title { color: var(--success); }
    .modal-danger .modal-card { border-top: 6px solid var(--danger); }
    .modal-danger .modal-title { color: var(--danger); }
    .modal-info .modal-card { border-top: 6px solid var(--active); }
    .modal-info .modal-title { color: var(--active); }
    .modal-btn { flex: 1; height: 48px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; color: #fff; }
    .modal-success .modal-btn { background-color: var(--success); }
    .modal-danger .modal-btn { background-color: var(--danger); }
    .modal-info .modal-btn { background-color: var(--active); }
  </style>
</head>
<body>
  <h1>줄고누</h1>

  <div class="container-fixed game-area">
    <div class="game-toolbar">
      <div id="jul-options" style="margin-bottom: 10px;">
        <label style="font-size: 14px; font-weight: 700; color: var(--sub);">판 크기: </label>
        <select id="jul-size-select" style="padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-weight: 700;">
          <option value="4" selected>4 x 4</option>
          <option value="6">6 x 6</option>
          <option value="8">8 x 8</option>
          <option value="10">10 x 10</option>
          <option value="12">12 x 12</option>
          <option value="14">14 x 14</option>
          <option value="16">16 x 16</option>
          <option value="18">18 x 18</option>
          <option value="20">20 x 20</option>
        </select>
      </div>

      <div class="toggle-group" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); height: 46px;">
          <label class="switch">
            <input type="checkbox" id="color-toggle" onchange="toggleUserColor()" checked>
            <span class="slider"></span>
          </label>
          <span id="color-label" style="font-size: 14px; font-weight: 700; color: var(--danger); width: 65px; text-align: left;">🔴 빨강</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); height: 46px;">
          <label class="switch">
            <input type="checkbox" id="turn-toggle" onchange="toggleTurnOrder()" checked>
            <span class="slider"></span>
          </label>
          <span id="turn-label" style="font-size: 14px; font-weight: 700; color: var(--text); width: 85px; text-align: left;">🎯 내가 선공</span>
        </div>
        <button class="control-btn" id="btn-reset">새로 시작</button>
        <button class="control-btn" id="btn-start" style="background-color: var(--active);">게임 시작</button>
      </div>
      <div id="turn-badge" class="status-badge">🔴 빨간팀 차례 (시작 대기)</div>
    </div>

    <div class="board-container" id="board-container">
      <canvas id="game-canvas"></canvas>
      <div id="piece-layer" class="piece-layer"></div>
    </div>
  </div>

  <div class="guide-box box-stats">
    <div class="guide-header">
      <h2>📊 누적 기록</h2>
      <button class="btn-reset-stats" onclick="resetStatsModal()">누적기록 초기화</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>종목</th>
          <th style="color: var(--success);">👤 사용자 승</th>
          <th style="color: var(--danger);">🤖 AI 승</th>
          <th>🎯 사용자 선공 승</th>
          <th>🤖 AI 선공 승</th>
        </tr>
      </thead>
      <tbody id="stats-body"></tbody>
    </table>
  </div>

  <div class="guide-box box-rules">
    <h2>◈ 놀이 규칙</h2>
    • <b>이동</b>: 빈 칸이라면 거리 제한 없이 직선(가로/세로)으로 이동 가능.<br>
    • <b>샌드위치</b>: 상대 말 1개를 내 말 사이에 가두면 획득.<br>
    • <b>포위</b>: 구석이나 가장자리에서 움직임이 막히면 상대 말 획득.<br>
    • 상대 말이 1개만 남으면 최종 승리!
  </div>

  <!-- <div class="guide-box box-keys">
    <h2>⌨ 키보드 단축키</h2>
    <p>
      <span class="key-badge">S</span> : 게임 시작<br>
      <span class="key-badge">R</span> : 새로 시작<br>
      <span class="key-badge">Enter</span> : 결과 팝업 닫기
    </p>
  </div> -->

  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">알림</div>
      <div id="modal-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="modal-btn" id="modal-btn" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

<script>
  document.addEventListener('contextmenu', e => e.preventDefault());

  const activeGame = 'jul';
  let userColor = 'red';
  let userGoesFirst = true;
  let currentGameFirstPlayer = 'user';
  let jState = { started: false };

  function toggleUserColor() {
    const isRed = document.getElementById('color-toggle').checked;
    userColor = isRed ? 'red' : 'blue';
    const label = document.getElementById('color-label');
    label.textContent = isRed ? '🔴 빨강' : '🔵 파랑';
    label.style.color = isRed ? 'var(--danger)' : 'var(--active)';
    resetCurrentGame();
  }

  function toggleTurnOrder() {
    const isUserFirst = document.getElementById('turn-toggle').checked;
    userGoesFirst = isUserFirst;
    const label = document.getElementById('turn-label');
    label.textContent = isUserFirst ? '🎯 내가 선공' : '🤖 AI 선공';
    resetCurrentGame();
  }

  function initUI() {
    document.getElementById('btn-start').addEventListener('click', startGameFlow);
    document.getElementById('btn-reset').addEventListener('click', confirmResetGame);
    document.getElementById('jul-size-select').addEventListener('change', resetJul);
    window.addEventListener('resize', redrawBoard);
    window.addEventListener('keydown', handleKeyboard);
    renderStats();
    resetCurrentGame();
  }

  function startGameFlow() {
    if (document.getElementById('btn-start').disabled) return;
    startJul();
  }

  function resetCurrentGame() {
    resetJul();
    updateTurnBorder(null);
    const badge = document.getElementById('turn-badge');
    badge.className = 'status-badge';
    badge.style.backgroundColor = '#f8f9fa';
    badge.style.color = 'var(--sub)';
    badge.style.borderColor = 'var(--border)';
    const startColorName = userGoesFirst ? (userColor === 'red' ? '🔴 빨간팀' : '🔵 파란팀') : (userColor === 'red' ? '🔵 파란팀' : '🔴 빨간팀');
    badge.textContent = `${startColorName} 차례 (시작 대기)`;
    
    document.getElementById('btn-start').disabled = false;
  }

  function confirmResetGame() {
    showCustomModal(
      '🔄 새로 시작',
      '게임을 새로 시작하시겠습니까?',
      'info',
      () => { resetCurrentGame(); },
      { showCancel: true, confirmText: '확인', cancelText: '취소' }
    );
  }

  function redrawBoard() { initJulBoard(); }

  function updateTurnBorder(team) {
    const container = document.getElementById('board-container');
    if (team === 'red') container.style.borderColor = 'var(--danger)';
    else if (team === 'blue') container.style.borderColor = 'var(--active)';
    else container.style.borderColor = 'var(--border)';
  }

  function updateBadge(team, isAI, aiColor, extraMsg = '') {
    updateTurnBorder(team);
    const badge = document.getElementById('turn-badge');
    const name = team === 'red' ? '🔴 빨간팀' : '🔵 파란팀';
    const isAiTurn = team === aiColor;
    const aiText = isAiTurn ? ' (AI 수 읽는 중...)' : '';
    badge.textContent = `${name} 차례${extraMsg}${aiText}`;
    badge.className = `status-badge ${team}-turn`;
  }

  function handleKeyboard(e) {
    if (document.getElementById('result-modal').classList.contains('show')) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeModal(); }
      return;
    }
    if (e.key.toLowerCase() === 's') startGameFlow();
    else if (e.key.toLowerCase() === 'r') confirmResetGame();
  }

  function getStats(game) {
    const stats = JSON.parse(localStorage.getItem('gonu_stats_v2')) || {};
    return stats[game] || { userWins: 0, aiWins: 0, userFirstWins: 0, aiFirstWins: 0 };
  }

  function addScore(game, winnerTeam) {
    const stats = JSON.parse(localStorage.getItem('gonu_stats_v2')) || {};
    if (!stats[game]) stats[game] = { userWins: 0, aiWins: 0, userFirstWins: 0, aiFirstWins: 0 };
    
    const isUserWin = (winnerTeam === userColor);
    if (isUserWin) {
      stats[game].userWins += 1;
      if (currentGameFirstPlayer === 'user') stats[game].userFirstWins += 1;
    } else {
      stats[game].aiWins += 1;
      if (currentGameFirstPlayer === 'ai') stats[game].aiFirstWins += 1;
    }
    localStorage.setItem('gonu_stats_v2', JSON.stringify(stats));
    renderStats();
  }

  function resetStatsModal() {
    showCustomModal(
      '📊 누적기록 초기화',
      '누적된 기록을 초기화하시겠습니까?',
      'danger',
      () => {
        localStorage.removeItem('gonu_stats_v2');
        renderStats();
      },
      {
        showCancel: true,
        confirmText: '초기화',
        cancelText: '취소',
        confirmColor: 'var(--danger)'
      }
    );
  }

  function renderStats() {
    const tbody = document.getElementById('stats-body');
    const st = getStats(activeGame);
    tbody.innerHTML = `
      <tr>
        <td style="font-weight:700;">줄고누</td>
        <td style="color:var(--success); font-weight:700;">${st.userWins}승</td>
        <td style="color:var(--danger); font-weight:700;">${st.aiWins}승</td>
        <td>${st.userFirstWins}승</td>
        <td>${st.aiFirstWins}승</td>
      </tr>`;
  }

  function showCustomModal(titleText, bodyHtml, type = 'info', onConfirm = null, options = {}) {
    const { showCancel = false, confirmText = '확인', cancelText = '취소', confirmColor = null } = options;
    const modal = document.getElementById('result-modal');
    const title = document.getElementById('modal-title');
    const btnContainer = document.getElementById('modal-buttons');

    modal.classList.remove('modal-success', 'modal-danger', 'modal-info');
    modal.classList.add(`modal-${type}`);
    title.innerHTML = `<div>${titleText}</div><div style="font-size:15px; font-weight:500; margin-top:12px; color:var(--text);">${bodyHtml || ''}</div>`;
    
    btnContainer.innerHTML = '';

    if (showCancel) {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn';
      cancelBtn.style.backgroundColor = 'var(--sub)';
      cancelBtn.textContent = cancelText;
      cancelBtn.onclick = closeModal;
      btnContainer.appendChild(cancelBtn);
    }

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'modal-btn';
    if (confirmColor) confirmBtn.style.backgroundColor = confirmColor;
    confirmBtn.textContent = confirmText;
    confirmBtn.onclick = () => {
      closeModal();
      if (onConfirm) onConfirm();
    };
    btnContainer.appendChild(confirmBtn);

    modal.classList.add('show');
    confirmBtn.focus();
  }

  function showWinModal(winnerTeam) {
    const isUserWin = (winnerTeam === userColor);
    const winnerTitle = isUserWin ? '🎉 사용자 승리!' : '🤖 AI 승리!';
    const firstPlayerText = currentGameFirstPlayer === 'user' ? '👤 사용자 선공' : '🤖 AI 선공';
    const colorStr = isUserWin ? 'var(--success)' : 'var(--danger)';
    showCustomModal(`<span style="color:${colorStr}">${winnerTitle}</span>`, `<b>승자:</b> ${isUserWin ? '사용자' : 'AI'}<br><b>선공:</b> ${firstPlayerText}`, isUserWin ? 'success' : 'danger');
  }

  function closeModal() { document.getElementById('result-modal').classList.remove('show'); }

  function initJulBoard() {
    const cvs = document.getElementById('game-canvas');
    const ctn = document.getElementById('board-container');
    const size = parseInt(document.getElementById('jul-size-select').value);
    
    if (size >= 8) {
      ctn.style.maxWidth = '100%';
    } else {
      ctn.style.maxWidth = '500px';
    }

    cvs.width = ctn.clientWidth; cvs.height = ctn.clientHeight;
    const ctx = cvs.getContext('2d');
    jState.size = size;
    const cellS = cvs.width / size;

    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.strokeStyle = '#a68b75'; ctx.lineWidth = Math.max(1.5, cellS * 0.04);

    for (let i = 0; i < size; i++) {
      const pos = i * cellS + cellS / 2;
      ctx.beginPath(); ctx.moveTo(cellS/2, pos); ctx.lineTo(cvs.width - cellS/2, pos); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pos, cellS/2); ctx.lineTo(pos, cvs.height - cellS/2); ctx.stroke();
    }
    renderJul();
  }

  function resetJul() {
    const size = parseInt(document.getElementById('jul-size-select').value);
    jState = { started: false, size: size, selected: null };
    jState.board = Array(size * size).fill(null);
    for (let i = 0; i < size; i++) {
      jState.board[i] = 'red';
      jState.board[size * (size - 1) + i] = 'blue';
    }
    initJulBoard();
  }

  function startJul() {
    resetJul();
    jState.started = true;
    jState.selected = null;
    jState.aiColor = userColor === 'red' ? 'blue' : 'red';
    jState.turn = userGoesFirst ? userColor : jState.aiColor;
    currentGameFirstPlayer = userGoesFirst ? 'user' : 'ai';
    
    document.getElementById('btn-start').disabled = true;

    updateBadge(jState.turn, true, jState.aiColor);
    renderJul();
    if(jState.turn === jState.aiColor) setTimeout(aiJulOptimized, 400);
  }

  function renderJul() {
    const layer = document.getElementById('piece-layer');
    layer.innerHTML = '';
    if(!jState.board) { layer.style.display = 'none'; return; }
    layer.style.display = 'grid';
    layer.style.gridTemplateColumns = `repeat(${jState.size}, 1fr)`;
    
    jState.board.forEach((p, i) => {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.onclick = () => handleJulClick(i);
      
      if (p) {
        const piece = document.createElement('div');
        piece.className = `grid-piece ${p} ${jState.selected === i ? 'selected' : ''}`;
        cell.appendChild(piece);
      } else if (jState.started && jState.selected !== null && getJulMoves(jState.board, jState.size, jState.selected).includes(i)) {
        const hint = document.createElement('div');
        hint.className = 'grid-hint';
        cell.appendChild(hint);
      }
      layer.appendChild(cell);
    });
  }

  function getJulMoves(board, sz, from) {
    const moves = [];
    const r = Math.floor(from / sz), c = from % sz;
    const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
    dirs.forEach(([dr, dc]) => {
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr < sz && nc >= 0 && nc < sz) {
        const idx = nr * sz + nc;
        if (board[idx] === null) moves.push(idx);
        else break;
        nr += dr; nc += dc;
      }
    });
    return moves;
  }

  function simulateJulCaptures(board, sz, to) {
    const newBoard = [...board];
    const me = newBoard[to], enemy = me === 'red' ? 'blue' : 'red';
    const r = Math.floor(to / sz), c = to % sz;

    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr, dc]) => {
      const mr = r + dr, mc = c + dc;
      const er = r + dr * 2, ec = c + dc * 2;
      if (er >= 0 && er < sz && ec >= 0 && ec < sz) {
        if (newBoard[mr*sz+mc] === enemy && newBoard[er*sz+ec] === me) newBoard[mr*sz+mc] = null;
      }
      if (mr >= 0 && mr < sz && mc >= 0 && mc < sz) {
        const eIdx = mr*sz+mc;
        if (newBoard[eIdx] === enemy) {
          const eR = Math.floor(eIdx / sz), eC = eIdx % sz;
          let trapped = true;
          for(let [x,y] of [[0,1],[0,-1],[1,0],[-1,0]]) {
            const nr = eR + x, nc = eC + y;
            if(nr>=0 && nr<sz && nc>=0 && nc<sz && newBoard[nr*sz+nc] !== me) trapped = false;
          }
          if(trapped) newBoard[eIdx] = null;
        }
      }
    });
    return newBoard;
  }

  function handleJulClick(idx) {
    if (!jState.started || jState.turn === jState.aiColor) return;
    if (jState.board[idx] === jState.turn) {
      jState.selected = (jState.selected === idx) ? null : idx;
    } else if (jState.selected !== null && jState.board[idx] === null) {
      if (getJulMoves(jState.board, jState.size, jState.selected).includes(idx)) moveJul(jState.selected, idx);
      else jState.selected = null;
    }
    renderJul();
  }

  function moveJul(from, to) {
    jState.board[to] = jState.board[from];
    jState.board[from] = null;
    jState.board = simulateJulCaptures(jState.board, jState.size, to);
    jState.selected = null;
    jState.turn = jState.turn === 'red' ? 'blue' : 'red';
    renderJul();
    if(!checkJulWin()) {
      updateBadge(jState.turn, true, jState.aiColor);
      if(jState.turn === jState.aiColor) setTimeout(aiJulOptimized, 400);
    }
  }

  function checkJulWin() {
    const rc = jState.board.filter(p => p === 'red').length;
    const bc = jState.board.filter(p => p === 'blue').length;
    if (rc <= 1 || bc <= 1) {
      const winner = rc > 1 ? 'red' : 'blue';
      jState.started = false;
      addScore('jul', winner);

      const badge = document.getElementById('turn-badge');
      const winnerName = winner === 'red' ? '🔴 빨간팀' : '🔵 파란팀';
      badge.textContent = `🏁 게임 종료 (${winnerName} 승리!)`;
      badge.className = `status-badge ${winner}-turn`;

      document.getElementById('btn-start').disabled = false;

      showWinModal(winner);
      return true;
    }
    return false;
  }

  // --- 초고성능 AI 엔진 (Minimax + Alpha-Beta Pruning) ---

  function getAllJulMoves(board, sz, color) {
    const moves = [];
    for (let i = 0; i < board.length; i++) {
      if (board[i] === color) {
        const targets = getJulMoves(board, sz, i);
        for (let j = 0; j < targets.length; j++) {
          moves.push({ from: i, to: targets[j] });
        }
      }
    }
    return moves;
  }

  function simulateJulMove(board, sz, from, to) {
    const nextBoard = [...board];
    nextBoard[to] = nextBoard[from];
    nextBoard[from] = null;
    return simulateJulCaptures(nextBoard, sz, to);
  }

  function checkJulBoardWinner(board) {
    const rc = board.filter(p => p === 'red').length;
    const bc = board.filter(p => p === 'blue').length;
    if (rc <= 1) return 'blue';
    if (bc <= 1) return 'red';
    return null;
  }

  function evaluateJulBoard(board, sz, aiColor, oppColor) {
    let aiCount = 0;
    let oppCount = 0;
    for (let i = 0; i < board.length; i++) {
      if (board[i] === aiColor) aiCount++;
      else if (board[i] === oppColor) oppCount++;
    }

    // 1. 말 개수 차이 (최고 가중치)
    let score = (aiCount - oppCount) * 2000;

    // 2. 이동 유연성 (Mobility)
    const aiMoves = getAllJulMoves(board, sz, aiColor);
    const oppMoves = getAllJulMoves(board, sz, oppColor);
    score += (aiMoves.length - oppMoves.length) * 15;

    // 3. 상대의 다음 턴 위협 탐지 (상대가 한 수 만에 내 말을 포획할 수 있는지 검사)
    for (let m of oppMoves) {
      const oppSimBoard = simulateJulMove(board, sz, m.from, m.to);
      const lostAi = aiCount - oppSimBoard.filter(p => p === aiColor).length;
      if (lostAi > 0) {
        score -= lostAi * 900; // 잡힐 위험에 대한 강력한 감점
      }
    }

    // 4. 중앙 제어 및 거리 점수
    for (let i = 0; i < board.length; i++) {
      if (board[i] === aiColor) {
        let r = Math.floor(i / sz), c = i % sz;
        let centerDist = Math.abs(r - sz/2) + Math.abs(c - sz/2);
        score -= centerDist * 2;
      }
    }

    return score;
  }

  function minimaxJul(board, sz, depth, alpha, beta, isMaximizing, aiColor, oppColor) {
    const winner = checkJulBoardWinner(board);
    if (winner === aiColor) return { score: 1000000 + depth };
    if (winner === oppColor) return { score: -1000000 - depth };
    if (depth === 0) {
      return { score: evaluateJulBoard(board, sz, aiColor, oppColor) };
    }

    const currentColor = isMaximizing ? aiColor : oppColor;
    const moves = getAllJulMoves(board, sz, currentColor);

    if (moves.length === 0) {
      return { score: isMaximizing ? -500000 : 500000 };
    }

    // Alpha-Beta 가지치기 효율을 높이기 위해 포획 가능 수가 높은 순으로 먼저 정렬
    moves.sort((a, b) => {
      const b1 = simulateJulMove(board, sz, a.from, a.to);
      const b2 = simulateJulMove(board, sz, b.from, b.to);
      const capA = board.filter(p => p !== null).length - b1.filter(p => p !== null).length;
      const capB = board.filter(p => p !== null).length - b2.filter(p => p !== null).length;
      return capB - capA;
    });

    let bestMove = moves[0];

    if (isMaximizing) {
      let maxEval = -Infinity;
      for (let m of moves) {
        const nextBoard = simulateJulMove(board, sz, m.from, m.to);
        const evalRes = minimaxJul(nextBoard, sz, depth - 1, alpha, beta, false, aiColor, oppColor);
        if (evalRes.score > maxEval) {
          maxEval = evalRes.score;
          bestMove = m;
        }
        alpha = Math.max(alpha, maxEval);
        if (beta <= alpha) break;
      }
      return { score: maxEval, move: bestMove };
    } else {
      let minEval = Infinity;
      for (let m of moves) {
        const nextBoard = simulateJulMove(board, sz, m.from, m.to);
        const evalRes = minimaxJul(nextBoard, sz, depth - 1, alpha, beta, true, aiColor, oppColor);
        if (evalRes.score < minEval) {
          minEval = evalRes.score;
          bestMove = m;
        }
        beta = Math.min(beta, minEval);
        if (beta <= alpha) break;
      }
      return { score: minEval, move: bestMove };
    }
  }

  function aiJulOptimized() {
    if (!jState.started) return;
    const sz = jState.size;
    const color = jState.aiColor;
    const opp = color === 'red' ? 'blue' : 'red';

    // 판 크기에 맞춰 실시간 연산 깊이 동적 설정 (성능과 지능 최적 밸런스)
    let depth = 4;
    if (sz >= 8) depth = 3;
    if (sz >= 14) depth = 2;

    const result = minimaxJul(jState.board, sz, depth, -Infinity, Infinity, true, color, opp);

    if (result && result.move) {
      const chosen = result.move;
      jState.selected = chosen.from;
      renderJul();
      setTimeout(() => {
        if (jState.started) moveJul(chosen.from, chosen.to);
      }, 350);
    }
  }

  window.onload = initUI;
</script>
